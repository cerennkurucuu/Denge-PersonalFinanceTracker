@if (finance.categoryModal) {
  <div class="modal-backdrop" (click)="$event.target === $event.currentTarget && close()">
    <form class="modal-card small-modal" (ngSubmit)="finance.saveCategory()">
      <div class="modal-title">
        <div><span class="eyebrow">KATEGORİ YÖNETİMİ</span><h2>{{ finance.categoryForm.id ? 'Kategoriyi düzenle' : 'Yeni kategori' }}</h2></div>
        <button type="button" class="close-button" (click)="close()" aria-label="Kapat">×</button>
      </div>
      @if (finance.modalError) { <div class="form-error" role="alert">{{ finance.modalError }}</div> }
      <label for="category-name">Kategori adı
        <input id="category-name" name="catname" [(ngModel)]="finance.categoryForm.name" maxlength="40" placeholder="Örn. Evcil hayvan" required>
      </label>
      <label for="category-type">Tür
        <select id="category-type" name="cattype" [(ngModel)]="finance.categoryForm.type" [disabled]="!!finance.categoryForm.id">
          <option value="Expense">Gider</option><option value="Income">Gelir</option>
        </select>
      </label>
      <label for="category-icon">Simge
        <select id="category-icon" name="caticon" [(ngModel)]="finance.categoryForm.icon">
          @for (icon of iconOptions; track icon.value) { <option [value]="icon.value">{{ icon.symbol }} {{ icon.label }}</option> }
        </select>
      </label>
      <label for="category-color">Kategori rengi</label>
      <div class="category-color-picker">
        <input id="category-color" name="catcolor" [(ngModel)]="finance.categoryForm.color" type="color" aria-label="Renk seçici">
        <input id="category-color-hex" name="catcolorhex" [(ngModel)]="finance.categoryForm.color" type="text" pattern="^#[0-9a-fA-F]{6}$" maxlength="7" aria-label="Renk kodu" autocomplete="off">
      </div>
      <div class="color-presets" aria-label="Hazır renkler">
        @for (color of colorPresets; track color) {
          <button type="button" class="color-preset" [style.backgroundColor]="color" [attr.aria-label]="color + ' rengini seç'" [attr.aria-pressed]="finance.categoryForm.color.toLowerCase() === color" (click)="finance.categoryForm.color = color"></button>
        }
      </div>
      <div class="modal-actions">
        <button type="button" class="outline-button" (click)="close()">Vazgeç</button>
        <button type="submit" class="quick-add" (click)="$event.preventDefault(); finance.saveCategory()">Kaydet</button>
      </div>
    </form>
  </div>
}
