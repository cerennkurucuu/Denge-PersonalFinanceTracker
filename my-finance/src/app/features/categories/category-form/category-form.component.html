@if(finance.categoryModal){<div class="modal-backdrop" (click)="$event.target===$event.currentTarget&&close()"><form class="modal-card small-modal" (ngSubmit)="finance.saveCategory()"><div class="modal-title"><div><span class="eyebrow">KATEGORİ YÖNETİMİ</span><h2>{{finance.categoryForm.id?'Kategoriyi düzenle':'Yeni kategori'}}</h2></div><button type="button" class="close-button" (click)="close()">×</button></div>@if(finance.modalError){<div class="form-error" role="alert">{{finance.modalError}}</div>}<label>Kategori adı<input name="catname" [(ngModel)]="finance.categoryForm.name" maxlength="40" placeholder="Örn. Evcil hayvan" required></label><label>Tür<select name="cattype" [(ngModel)]="finance.categoryForm.type" [disabled]="!!finance.categoryForm.id"><option value="Expense">Gider</option><option value="Income">Gelir</option></select></label><label>Renk<input name="catcolor" [(ngModel)]="finance.categoryForm.color" type="color"></label><div class="modal-actions"><button type="button" class="outline-button" (click)="close()">Vazgeç</button><button type="submit" class="quick-add" (click)="$event.preventDefault();finance.saveCategory()">Kaydet</button></div></form></div>}
