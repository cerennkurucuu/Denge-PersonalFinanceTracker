@if(finance.transactionModal){<div class="modal-backdrop" (click)="$event.target===$event.currentTarget&&close()"><form class="modal-card" (ngSubmit)="finance.saveTransaction()"><div class="modal-title"><div><span class="eyebrow">{{finance.editingTransactionId?'DÜZENLE':'YENİ KAYIT'}}</span><h2>{{finance.editingTransactionId?'İşlemi düzenle':'İşlem ekle'}}</h2></div><button type="button" class="close-button" (click)="close()">×</button></div>@if(finance.modalError){<div class="form-error" role="alert">{{finance.modalError}}</div>}<div class="type-switch"><button type="button" [class.selected]="finance.transactionForm.type==='Expense'" (click)="finance.transactionForm.type='Expense';finance.transactionForm.category_id=0">Gider</button><button type="button" [class.selected]="finance.transactionForm.type==='Income'" (click)="finance.transactionForm.type='Income';finance.transactionForm.category_id=0">Gelir</button></div><label>Tutar<div class="amount-input"><span>₺</span><input name="amount" [(ngModel)]="finance.transactionForm.amount" type="number" min="0.01" step="0.01" placeholder="0,00" required></div></label><label>Açıklama<input name="description" [(ngModel)]="finance.transactionForm.description" maxlength="140" placeholder="Örn. Aylık market alışverişi" required></label><div class="form-row"><label>Kategori<select name="category" [(ngModel)]="finance.transactionForm.category_id" required><option [ngValue]="0" disabled>Kategori seç</option>@for(cat of finance.availableCategories;track cat.id){<option [ngValue]="cat.id">{{cat.name}}</option>}</select></label><label>Tarih<input name="date" [(ngModel)]="finance.transactionForm.transaction_date" type="date" required></label></div><div class="modal-actions"><button type="button" class="outline-button" (click)="close()">Vazgeç</button><button type="submit" class="quick-add" (click)="$event.preventDefault();finance.saveTransaction()">{{finance.editingTransactionId?'Değişiklikleri kaydet':'İşlemi kaydet'}}</button></div></form></div>}
