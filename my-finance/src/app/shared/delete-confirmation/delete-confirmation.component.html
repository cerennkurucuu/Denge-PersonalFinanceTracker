@if(finance.deletePrompt){<div class="modal-backdrop" (click)="$event.target===$event.currentTarget&&finance.cancelDelete()"><section class="modal-card delete-dialog" role="alertdialog" aria-modal="true" aria-labelledby="delete-title"><div class="modal-title"><div><span class="eyebrow">SİLME ONAYI</span><h2 id="delete-title">{{finance.deletePrompt.kind==='transaction'?'İşlem':'Kategori'}} silinsin mi?</h2></div><button type="button" class="close-button" (click)="finance.cancelDelete()" aria-label="Kapat">×</button></div><p>“{{finance.deletePrompt.label}}” kalıcı olarak silinecek.</p><div class="modal-actions"><button type="button" class="outline-button" (click)="finance.cancelDelete()">Vazgeç</button><button type="button" class="delete-confirm" (click)="finance.confirmDelete()">Sil</button></div></section></div>}
